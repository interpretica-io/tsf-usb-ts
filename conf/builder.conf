# The engine and the agent are built for the same platform: the agent runs
# on the engine host. tapi_usb drives libusb over the agent's RPC server,
# so the suite has a real agent with an RPC server, and the USB library
# lives in that server.
TE_PLATFORM([], [], [-D_GNU_SOURCE], [], [],
            [logger_core tools logic_expr conf_oid rpcxdr rpc_types \
             ipc bsapi loggerten rcfapi confapi comm_net_engine rcfunix \
             tapi rcfrpc tapi_env tapi_rpc tapi_tad trc log_proc asn ndn \
             ta_job tapi_job tapi_tool \
             netconf rpctransport agentlib loggerta comm_net_agent rpcs_job \
             rpcserver rcfpch tad])

# The external libraries under test. Their references live in
# conf/external.yml and the commits actually built in
# conf/builder.conf.lock. tapi_usb's posture reports through
# tapi_cybersec, which is built on tapi_kernel, which is built on
# tapi_devtool - so the chain is pulled in, engine-side only; only
# tsf_usb has agent-side libraries (ta_usb, rpcs_usb), listed again in
# the RPC server application below.
TE_EXT_REPO_USE([tsf_devtool], [], [tapi_devtool])
TE_EXT_REPO_USE([tsf_kernel], [], [tapi_kernel])
TE_EXT_REPO_USE([tsf_cybersec], [], [tapi_cybersec])
TE_EXT_REPO_USE([tsf_usb], [ta_usb rpcs_usb], [tapi_usb])

# The usb_* RPCs. The platform is shared by engine and agent, so one
# declaration wires rpcxdr (engine) and rpcxdrta (agent) both. See
# ta_usb/usb_rpc.x.m4.
TE_LIB_PARMS([rpcxdr], [], [],
             [--with-rpcdefs=tarpc_job.x.m4,../ta_usb/usb_rpc.x.m4])

TE_TOOLS([rgt trc])

TE_TOOL_PARMS([trc], [--with-popups --with-log-urls])

TE_APP_PARMS([tester], [--with-trc])

# One Test Agent of the stock unix flavour.
TE_TA_TYPE([linux], [], [unix],
           [--with-rcf-rpc --without-static-libc],
           [], [], [], [comm_net_agent rcfpch ndn asn])

# The RPC server application. tapi_usb's RPCs run here, so it links the
# agent-side ta_usb (USB enumeration over libusb-1.0) and rpcs_usb (the
# usb_* RPCs) on top of the stock RPC server. The agent host must carry
# libusb-1.0 with its development headers; see the tsf-usb README.
TE_TA_APP([ta_rpcprovider], [], [linux],
          [ta_rpcprovider], [], [],
          [ta_usb rpcs_usb \
           conf_oid ta_job comm_net_agent rpcs_job rpcserver agentlib rpcxdrta \
           rpc_types rpctransport loggerta tools logger_core \
           netconf],
          [\${EXT_SOURCES}/build.sh],
          [ta_rpcs], [])

. $TE_BASE/engine/builder/te_functions
. $TE_BASE/engine/builder/te_ta_ssh_helper
